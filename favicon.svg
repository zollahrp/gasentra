<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="64" height="64" rx="16" fill="#070e18"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#gasGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Smart Scale Base Ring -->
  <ellipse cx="32" cy="46" rx="22" ry="7" fill="#0b1728" stroke="url(#ringGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <ellipse cx="32" cy="46" rx="14" ry="4.5" fill="#050a12" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Gas Flame in Center -->
  <path d="M32 10C32 10 39 20 39 28C39 33.5228 35.866 38 32 38C28.134 38 25 33.5228 25 28C25 20 32 10 32 10Z" fill="url(#gasGrad)" filter="url(#glow)"/>
  <!-- Inner Flame Core (Clean Energy) -->
  <path d="M32 19C32 19 35.5 24.5 35.5 29C35.5 32 33.9 34.5 32 34.5C30.1 34.5 28.5 32 28.5 29C28.5 24.5 32 19 32 19Z" fill="#ffffff" opacity="0.9"/>

  <!-- Digital Pulse Nodes -->
  <circle cx="16" cy="46" r="2" fill="#10b981"/>
  <circle cx="48" cy="46" r="2" fill="#00f0ff"/>
  <circle cx="32" cy="49" r="2" fill="#38bdf8"/>
</svg>
