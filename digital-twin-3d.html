    <!-- Web Audio API Synthesizer for Siren -->
    <script>
        let audioCtx = null;
        let isAudioEnabled = false;
        let sirenOsc = null;
        let isSirenActive = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            initAudio();
            isAudioEnabled = !isAudioEnabled;
            const icon = document.getElementById('audioIcon');
            const btn = document.getElementById('btnAudioToggle');
            if (isAudioEnabled) {
                icon.className = 'fa-solid fa-volume-high text-gas-cyan';
                btn.className = 'glass-panel px-3 py-2 rounded-xl text-xs font-semibold text-gas-cyan border-gas-cyan/50';
                playChirp(880, 0.1);
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                btn.className = 'glass-panel px-3 py-2 rounded-xl text-xs font-semibold text-slate-400 border-gas-border';
                stopSiren();
            }
        }

        function playChirp(freq, duration) {
            if (!isAudioEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startSiren() {
            if (!isAudioEnabled || isSirenActive) return;
            initAudio();
            try {
                isSirenActive = true;
                sirenOsc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                sirenOsc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

                const lfo = audioCtx.createOscillator();
                lfo.frequency.setValueAtTime(2.5, audioCtx.currentTime);
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.setValueAtTime(320, audioCtx.currentTime);
                sirenOsc.frequency.setValueAtTime(800, audioCtx.currentTime);

                lfo.connect(lfoGain);
                lfoGain.connect(sirenOsc.frequency);
                sirenOsc.connect(gain);
                gain.connect(audioCtx.destination);

                lfo.start();
                sirenOsc.start();
            } catch(e) {}
        }

        function stopSiren() {
            if (sirenOsc) {
                try {
                    sirenOsc.stop();
                    sirenOsc.disconnect();
                } catch(e) {}
                sirenOsc = null;
            }
            isSirenActive = false;
        }
    </script>

    <!-- Three.js 3D Digital Twin Script -->
    <script>
        let scene, camera, renderer, controls;
        let is3DExploded = false;
        let isLeakSimulating = false;
        let currentLighting = 'day';

        // 3D Objects References
        let padsArray = [];
        let cylindersArray = [];
        let solenoidValveMesh = null;
        let gatewayMeshGroup = null;
        let wokFlamesArray = [];
        let stoveFlameLight = null;
        let gasParticles = null;
        let gasParticleGeo = null;
        let gasParticleMat = null;
        let gasParticlePositions = [];

        // Lighting References
        let ambientLight, mainDirLight, emergencyStrobeLight;

        // Camera presets
        const cameraPositions = {
            overview: { pos: new THREE.Vector3(0, 7, 14), target: new THREE.Vector3(0, 2, 0) },
            manifold: { pos: new THREE.Vector3(0, 3.5, 6.5), target: new THREE.Vector3(0, 1.8, 0) },
            leak: { pos: new THREE.Vector3(-1.4, 2.2, 4.0), target: new THREE.Vector3(-1.4, 1.4, 0) },
            gateway: { pos: new THREE.Vector3(3.5, 4.2, 3.5), target: new THREE.Vector3(3.2, 3.8, -1.8) },
            burner: { pos: new THREE.Vector3(-4.8, 3.0, 3.8), target: new THREE.Vector3(-5.5, 1.4, -0.2) }
        };

        let targetCameraPos = cameraPositions.overview.pos.clone();
        let targetControlsTarget = cameraPositions.overview.target.clone();

        function init3D() {
            const container = document.getElementById('webgl-canvas-container');
            const width = window.innerWidth;
            const height = window.innerHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060c16);
            scene.fog = new THREE.FogExp2(0x060c16, 0.035);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            camera.position.copy(cameraPositions.overview.pos);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 2;
            controls.maxDistance = 25;
            controls.target.copy(cameraPositions.overview.target);

            // Setup Lights
            ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            mainDirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
            mainDirLight.position.set(6, 12, 8);
            mainDirLight.castShadow = true;
            mainDirLight.shadow.mapSize.width = 2048;
            mainDirLight.shadow.mapSize.height = 2048;
            scene.add(mainDirLight);

            emergencyStrobeLight = new THREE.PointLight(0xff0000, 0, 20);
            emergencyStrobeLight.position.set(0, 6, 2);
            scene.add(emergencyStrobeLight);

            // BUILD ENVIRONMENT
            buildKitchenEnvironment();
            buildGasManifold();
            buildCylindersAndPads();
            buildWallGateway();
            buildWokCookingStation();
            buildGasLeakParticles();

            window.addEventListener('resize', onWindowResize);
            requestAnimationFrame(renderLoop);
        }

        // --- 1. KITCHEN ENVIRONMENT ---
        function buildKitchenEnvironment() {
            // Epoxy Industrial Floor
            const floorGeo = new THREE.PlaneGeometry(30, 24);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x091424,
                roughness: 0.4,
                metalness: 0.3
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Yellow/Black Safety Hazard Stripes in front of Manifold
            const stripeGeo = new THREE.PlaneGeometry(12, 0.3);
            const stripeMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.rotation.x = -Math.PI / 2;
            stripe.position.set(0, 0.01, 1.8);
            scene.add(stripe);

            // Back Wall with Stainless Steel Panels
            const wallGeo = new THREE.PlaneGeometry(30, 10);
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x111f35,
                metalness: 0.6,
                roughness: 0.4
            });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 5, -2);
            wall.receiveShadow = true;
            scene.add(wall);

            // Stainless Panel Trim lines
            for (let i = -12; i <= 12; i += 3) {
                const trimGeo = new THREE.BoxGeometry(0.04, 10, 0.02);
                const trimMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.9 });
                const trim = new THREE.Mesh(trimGeo, trimMat);
                trim.position.set(i, 5, -1.98);
                scene.add(trim);
            }
        }

        // --- 2. GAS MANIFOLD PIPE SYSTEM ---
        function buildGasManifold() {
            const manifoldGroup = new THREE.Group();

            // Main Horizontal Manifold Pipe (Yellow Industrial Gas Line)
            const mainPipeGeo = new THREE.CylinderGeometry(0.08, 0.08, 9, 24);
            const mainPipeMat = new THREE.MeshStandardMaterial({
                color: 0xfacc15, // Yellow gas pipe
                metalness: 0.7,
                roughness: 0.3
            });
            const mainPipe = new THREE.Mesh(mainPipeGeo, mainPipeMat);
            mainPipe.rotation.z = Math.PI / 2;
            mainPipe.position.set(0, 2.2, -1.5);
            mainPipe.castShadow = true;
            manifoldGroup.add(mainPipe);

            // In-Line Automatic Red Solenoid Emergency Valve
            const solGeo = new THREE.BoxGeometry(0.4, 0.5, 0.4);
            const solMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.6, roughness: 0.2 });
            solenoidValveMesh = new THREE.Mesh(solGeo, solMat);
            solenoidValveMesh.position.set(0, 2.2, -1.5);
            solenoidValveMesh.castShadow = true;
            manifoldGroup.add(solenoidValveMesh);

            // Solenoid Indicator LED (Green by default)
            const solLedGeo = new THREE.SphereGeometry(0.06, 16, 16);
            const solLedMat = new THREE.MeshBasicMaterial({ color: 0x10b981 });
            const solLed = new THREE.Mesh(solLedGeo, solLedMat);
            solLed.position.set(0, 2.45, -1.3);
            solenoidValveMesh.add(solLed);

            // Manifold Pressure Gauge (Analog dial)
            const gaugeGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.08, 24);
            const gaugeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const gauge = new THREE.Mesh(gaugeGeo, gaugeMat);
            gauge.rotation.x = Math.PI / 2;
            gauge.position.set(1.5, 2.6, -1.45);
            manifoldGroup.add(gauge);

            // 4 Gas Down-Pipes with Brass Ball Valves connecting to hoses
            const xPositions = [-3.0, -1.2, 0.8, 2.8];
            xPositions.forEach((xPos, idx) => {
                // Vertical dropper pipe
                const dropGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 16);
                const dropMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 });
                const drop = new THREE.Mesh(dropGeo, dropMat);
                drop.position.set(xPos, 1.9, -1.5);
                manifoldGroup.add(drop);

                // Brass Isolation Valve
                const brassGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
                const brassMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.9, roughness: 0.2 });
                const brass = new THREE.Mesh(brassGeo, brassMat);
                brass.position.set(xPos, 1.6, -1.5);
                manifoldGroup.add(brass);

                // Flexible Stainless Steel Braided Hose dropping to cylinder
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(xPos, 1.55, -1.5),
                    new THREE.Vector3(xPos, 1.2, -1.1),
                    new THREE.Vector3(xPos, 1.1, -0.4)
                ]);
                const hoseGeo = new THREE.TubeGeometry(curve, 20, 0.03, 8, false);
                const hoseMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.3 });
                const hose = new THREE.Mesh(hoseGeo, hoseMat);
                manifoldGroup.add(hose);
            });

            scene.add(manifoldGroup);
        }

        // --- 3. LPG CYLINDERS & GASENTRA SMART BASE PADS ---
        function buildCylindersAndPads() {
            const configs = [
                { id: 'T1', x: -3.0, z: -0.4, type: '12kg', color: 0xdb2777, name: 'Tabung 1' },
                { id: 'T2', x: -1.2, z: -0.4, type: '12kg', color: 0xdb2777, name: 'Tabung 2 (Leak Target)' },
                { id: 'T3', x: 0.8, z: -0.4, type: '12kg', color: 0xdb2777, name: 'Tabung 3 (New)' },
                { id: 'T4', x: 2.8, z: -0.4, type: '50kg', color: 0x2563eb, name: 'Tabung 4 (Industrial)' }
            ];

            configs.forEach((cfg) => {
                // A. BUILD GASENTRA SMART BASE PAD UNDERNEATH
                const padGroup = new THREE.Group();
                padGroup.position.set(cfg.x, 0, cfg.z);

                // Pad Base Chassis (Dark Cast Aluminum)
                const baseGeo = new THREE.CylinderGeometry(1.05, 1.1, 0.12, 32);

            sRod.rotation.x = Math.PI / 2;
            spatulaGroup.add(sRod);
            const sBlade = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.005, 16, 1, false, 0, Math.PI), chromeMat);
            sBlade.position.set(0, 0, 0.22);
            spatulaGroup.add(sBlade);
            cooktopGroup.add(spatulaGroup);

            scene.add(cooktopGroup);
        }

        // --- 6. GAS LEAK PARTICLES (STREAMING FROM TABUNG 2) ---
        function buildGasLeakParticles() {
            const particleCount = 200;
            gasParticleGeo = new THREE.BufferGeometry();
            gasParticlePositions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                gasParticlePositions[i * 3] = -1.2 + (Math.random() - 0.5) * 0.4;
                gasParticlePositions[i * 3 + 1] = 1.35 + Math.random() * 0.5;
                gasParticlePositions[i * 3 + 2] = -0.4 + (Math.random() - 0.5) * 0.4;
            }

            gasParticleGeo.setAttribute('position', new THREE.BufferAttribute(gasParticlePositions, 3));

            gasParticleMat = new THREE.PointsMaterial({
                color: 0x38bdf8,
                size: 0.08,
                transparent: true,
                opacity: 0, // invisible until leak triggers
                blending: THREE.AdditiveBlending
            });

            gasParticles = new THREE.Points(gasParticleGeo, gasParticleMat);
            scene.add(gasParticles);
        }

        // --- ANIMATION RENDER LOOP ---
        let lastFrameTime = performance.now();
        let frameCount = 0;

        function renderLoop(now) {
            requestAnimationFrame(renderLoop);

            // FPS Counter
            frameCount++;
            if (now - lastFrameTime >= 1000) {
                document.getElementById('fpsCounter').innerText = frameCount;
                frameCount = 0;
                lastFrameTime = now;
            }

            // Smooth Camera Interpolation
            camera.position.lerp(targetCameraPos, 0.05);
            controls.target.lerp(targetControlsTarget, 0.05);
            controls.update();

            // Smooth Exploded View Layer Interpolation
            const padExplodedTarget = is3DExploded ? 1.2 : 0.16;
            const cylExplodedTarget = is3DExploded ? 1.5 : 0.19;

            padsArray.forEach(p => {
                p.platter.position.y += (padExplodedTarget - p.platter.position.y) * 0.08;
            });
            cylindersArray.forEach(c => {
                c.group.position.y += (cylExplodedTarget - c.group.position.y) * 0.08;
            });

            // Gas Leak Particle Simulation (if leak is active)
            if (isLeakSimulating && gasParticles) {
                const pos = gasParticleGeo.attributes.position.array;
                for (let i = 0; i < pos.length / 3; i++) {
                    // Leak stream drops and swirls downwards (LPG denser than air)
                    pos[i * 3 + 1] -= 0.02 + Math.random() * 0.01;
                    pos[i * 3] += (Math.random() - 0.5) * 0.03;
                    pos[i * 3 + 2] += (Math.random() - 0.5) * 0.03;

                    // Reset particle when it reaches floor
                    if (pos[i * 3 + 1] < 0.1) {
                        pos[i * 3] = -1.2 + (Math.random() - 0.5) * 0.2;
                        pos[i * 3 + 1] = 1.35;
                        pos[i * 3 + 2] = -0.4 + (Math.random() - 0.5) * 0.2;
                    }
                }
                gasParticleGeo.attributes.position.needsUpdate = true;
            }

            // Wok Flame Jitter & Dynamic Lighting
            if (stoveFlameLight) {
                if (isLeakSimulating) {
                    stoveFlameLight.intensity = 0;
                } else {
                    stoveFlameLight.intensity = 2.2 + Math.sin(now * 0.03) * 0.6 + (Math.random() - 0.5) * 0.4;
                }
            }
            wokFlamesArray.forEach((f, idx) => {
                if (isLeakSimulating) {
                    f.scale.set(0.001, 0.001, 0.001); // Flame cuts out!
                } else {
                    const jitter = 0.8 + Math.sin(now * 0.02 + idx) * 0.3;
                    f.scale.set(1, jitter, 1);
                }
            });

            // Emergency Hazard Light Strobe Pulse
            if (currentLighting === 'emergency' || isLeakSimulating) {
                const strobe = (Math.sin(now * 0.015) + 1) / 2;
                emergencyStrobeLight.intensity = strobe * 4.5;
            } else {
                emergencyStrobeLight.intensity = 0;
            }

            renderer.render(scene, camera);
        }

        // --- INTERACTIVE ACTIONS & SIMULATIONS ---
        function trigger3DLeakSimulation() {
            isLeakSimulating = !isLeakSimulating;
            const btn = document.getElementById('btn3DLeak');
            const btnText = document.getElementById('btn3DLeakText');
            const valvePill = document.getElementById('hudValveStatusPill');
            const valveText = document.getElementById('hudValveStatusText');
            const ppmText = document.getElementById('hudGasPpm');
            const flameText = document.getElementById('hudFlameStatus');

            if (isLeakSimulating) {
                btn.className = 'px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-display font-bold text-xs uppercase tracking-wider flex items-center gap-2 border border-slate-700 transition';
                btnText.innerText = 'Pulihkan / Matikan Kebocoran';

                // Particle visibility
                if (gasParticleMat) gasParticleMat.opacity = 0.75;

                // Tabung 2 Halo LED turns Red
                const pad2 = padsArray.find(p => p.id === 'T2');
                if (pad2) pad2.halo.material.color.setHex(0xef4444);

                // Solenoid valve turns off
                if (solenoidValveMesh) {
                    solenoidValveMesh.children[0].material.color.setHex(0xef4444);
                }

                // Update HUD
                valvePill.className = 'glass-panel px-4 py-2 rounded-xl text-xs font-mono font-bold flex items-center gap-2 border-red-500/80 text-red-300 animate-pulse glow-red';
                valveText.innerText = 'KATUP SOLENOID: SHUT OFF (BOCOR)';
                ppmText.innerText = '850 ppm (BAHAYA!)';
                ppmText.className = 'font-bold text-red-400 animate-pulse';
                flameText.innerText = 'PADAM (GAS DIPUTUS)';
                flameText.className = 'font-bold text-red-400';

                // Sound & Emergency Lighting
                startSiren();
                setLightingMode('emergency');
                flyToView('leak');
            } else {
                btn.className = 'px-4 py-2 rounded-xl bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-display font-bold text-xs uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-red-900/40 transition';
                btnText.innerText = 'Simulasikan Bocor Tabung 2';

                if (gasParticleMat) gasParticleMat.opacity = 0;

                const pad2 = padsArray.find(p => p.id === 'T2');
                if (pad2) pad2.halo.material.color.setHex(0x10b981);

                if (solenoidValveMesh) {
                    solenoidValveMesh.children[0].material.color.setHex(0x10b981);
                }

                valvePill.className = 'glass-panel px-4 py-2 rounded-xl text-xs font-mono font-bold flex items-center gap-2 border-emerald-500/50 text-emerald-300';
                valveText.innerText = 'KATUP SOLENOID: OPEN';
                ppmText.innerText = '22 ppm';
                ppmText.className = 'font-bold text-emerald-400';
                flameText.innerText = 'MENYALA BIRU';
                flameText.className = 'font-bold text-gas-cyan';

                stopSiren();
                setLightingMode('day');
            }
        }

        function toggle3DExplodedView() {
            is3DExploded = !is3DExploded;
            const btn = document.getElementById('btn3DExploded');
            const text = document.getElementById('btn3DExplodedText');

            if (is3DExploded) {
                btn.className = 'px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-display font-bold text-xs uppercase tracking-wider flex items-center gap-2 shadow-lg transition';
                text.innerText = 'Tutup Struktur (Assemble)';
                playChirp(800, 0.1);
            } else {
                btn.className = 'px-4 py-2 rounded-xl bg-gas-blue hover:bg-blue-600 text-white font-display font-bold text-xs uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-gas-blue/20 transition';
                text.innerText = 'Bongkar Struktur Pad (Exploded)';
                playChirp(600, 0.1);
            }
        }

        function flyToView(viewKey) {
            const target = cameraPositions[viewKey];
            if (!target) return;
            targetCameraPos.copy(target.pos);
            targetControlsTarget.copy(target.target);

            // Update UI buttons
            const btns = ['camBtnOverview', 'camBtnManifold', 'camBtnLeak', 'camBtnGateway', 'camBtnBurner'];
            btns.forEach(bId => {
                const b = document.getElementById(bId);
                if (b) b.className = 'py-1.5 px-2.5 rounded-lg text-left font-semibold bg-gas-card text-slate-300 hover:text-white border border-gas-border flex items-center justify-between transition';
            });
            const activeMap = {
                overview: 'camBtnOverview',
                manifold: 'camBtnManifold',
                leak: 'camBtnLeak',
                gateway: 'camBtnGateway',
                burner: 'camBtnBurner'
            };
            const activeBtn = document.getElementById(activeMap[viewKey]);
            if (activeBtn) activeBtn.className = 'py-1.5 px-2.5 rounded-lg text-left font-semibold bg-gas-blue text-white border border-gas-blue flex items-center justify-between transition';
            playChirp(920, 0.08);
        }

        function setLightingMode(mode) {
            currentLighting = mode;
            const bD = document.getElementById('lightDayBtn');
            const bN = document.getElementById('lightNightBtn');
            const bE = document.getElementById('lightEmerBtn');

            bD.className = 'py-1 rounded bg-gas-card text-slate-400 text-center hover:text-white';
            bN.className = 'py-1 rounded bg-gas-card text-slate-400 text-center hover:text-white';
            bE.className = 'py-1 rounded bg-gas-card text-red-400 text-center hover:bg-red-950/40';

            if (mode === 'day') {
                bD.className = 'py-1 rounded bg-gas-blue text-white text-center font-bold';
                ambientLight.color.setHex(0xffffff);
                ambientLight.intensity = 0.85;
                mainDirLight.intensity = 1.2;
                scene.fog.color.setHex(0x060c16);
            } else if (mode === 'night') {
                bN.className = 'py-1 rounded bg-gas-blue text-white text-center font-bold';
                ambientLight.color.setHex(0x1e3a5f);
                ambientLight.intensity = 0.35;
                mainDirLight.intensity = 0.5;
                scene.fog.color.setHex(0x02050b);
            } else {
                bE.className = 'py-1 rounded bg-red-600 text-white text-center font-bold';
                ambientLight.color.setHex(0x7f1d1d);
                ambientLight.intensity = 0.5;
                mainDirLight.intensity = 0.4;
            }
        }

        function reset3DScene() {
            if (isLeakSimulating) trigger3DLeakSimulation();
            if (is3DExploded) toggle3DExplodedView();
            setLightingMode('day');
            flyToView('overview');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', init3D);
    </script>
</body>
</html>
