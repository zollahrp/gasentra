<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="iconFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="iconRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect x="4" y="4" width="72" height="72" rx="20" fill="#070e18" stroke="url(#iconRing)" stroke-width="2"/>
  
  <!-- Cylinder scale ring -->
  <ellipse cx="40" cy="56" rx="28" ry="9" fill="#0c1726" stroke="url(#iconRing)" stroke-width="2.5" filter="url(#iconGlow)"/>
  <ellipse cx="40" cy="56" rx="18" ry="5.5" fill="#050a12" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- Center Flame -->
  <path d="M40 16C40 16 49 28 49 37C49 43.5 45 49 40 49C35 49 31 43.5 31 37C31 28 40 16 40 16Z" fill="url(#iconFlame)" filter="url(#iconGlow)"/>
  <path d="M40 26C40 26 44.5 32 44.5 37.5C44.5 41 42.5 44 40 44C37.5 44 35.5 41 35.5 37.5C35.5 32 40 26 40 26Z" fill="#ffffff" opacity="0.95"/>

  <!-- Pulsing nodes -->
  <circle cx="20" cy="56" r="2.5" fill="#10b981"/>
  <circle cx="60" cy="56" r="2.5" fill="#00f0ff"/>
  <circle cx="40" cy="60" r="2.5" fill="#38bdf8"/>
</svg>
